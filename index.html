<!DOCTYPE html>
<html>
<head>
    <title>CRUD App</title>
</head>
<body>

<h2>Add / Update User</h2>

<input type="text" id="name" placeholder="Enter Name"><br><br>
<input type="email" id="email" placeholder="Enter Email"><br><br>

<button onclick="handleSubmit()">Submit</button>

<h3>Users List</h3>
<ul id="userList"></ul>

<script>
    const BASE_URL = "http://192.168.1.8:5000";
    let editId = null;

    // 🔥 CREATE + UPDATE
    async function handleSubmit() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        if (!name || !email) {
            alert("Fill all fields");
            return;
        }

        if (editId) {
            // UPDATE
            await fetch(BASE_URL + "/updateUser/" + editId, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email })
            });
            editId = null;
        } else {
            // CREATE
            await fetch(BASE_URL + "/addUser", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email })
            });
        }

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";

        getUsers();
    }

    // 🔥 READ
    async function getUsers() {
        const res = await fetch(BASE_URL + "/getUsers");
        const data = await res.json();

        const list = document.getElementById("userList");
        list.innerHTML = "";

        data.forEach(user => {
            const li = document.createElement("li");

            li.innerHTML = `
                ${user.name} - ${user.email}
                <button onclick="editUser('${user._id}', '${user.name}', '${user.email}')">Edit</button>
                <button onclick="deleteUser('${user._id}')">Delete</button>
            `;

            list.appendChild(li);
        });
    }

    // 🔥 DELETE
    async function deleteUser(id) {
        await fetch(BASE_URL + "/deleteUser/" + id, {
            method: "DELETE"
        });

        getUsers();
    }

    // 🔥 EDIT (fill inputs)
    function editUser(id, name, email) {
        document.getElementById("name").value = name;
        document.getElementById("email").value = email;
        editId = id;
    }

    getUsers();
</script>

</body>
</html>
